name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact v0.8.0 annotated test baseline
        run: git fetch --depth=1 --no-tags origin refs/tags/v0.8.0:refs/tags/v0.8.0
      - name: Verify exact v0.8.0 test baseline
        run: |
          node -e 'const { execFileSync } = require("node:child_process"); const git = (args) => execFileSync("git", args, { encoding: "utf8" }).trim(); if (git(["rev-parse", "--verify", "refs/tags/v0.8.0^{tag}"]) !== "d03d7f4e5f63cf2c76a3e24f87854681ffac9959") throw new Error("v0.8.0 annotated tag object mismatch"); if (git(["rev-parse", "--verify", "refs/tags/v0.8.0^{}"]) !== "68a5cd175b16d26fd58834acd489ebcbe8a8ec57") throw new Error("v0.8.0 peeled commit mismatch");'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install required Linux bubblewrap sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          command -v bwrap
          bwrap --version
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - run: npm run validate
      - run: npm run eval:offline
      - run: npm run pack:dry-run
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact v0.8.0 annotated test baseline
        run: git fetch --depth=1 --no-tags origin refs/tags/v0.8.0:refs/tags/v0.8.0
      - name: Verify exact v0.8.0 test baseline
        run: |
          node -e 'const { execFileSync } = require("node:child_process"); const git = (args) => execFileSync("git", args, { encoding: "utf8" }).trim(); if (git(["rev-parse", "--verify", "refs/tags/v0.8.0^{tag}"]) !== "d03d7f4e5f63cf2c76a3e24f87854681ffac9959") throw new Error("v0.8.0 annotated tag object mismatch"); if (git(["rev-parse", "--verify", "refs/tags/v0.8.0^{}"]) !== "68a5cd175b16d26fd58834acd489ebcbe8a8ec57") throw new Error("v0.8.0 peeled commit mismatch");'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run eval:offline
      - run: npm run pack:dry-run
