name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release version, for example 0.9.0'
        required: true
        type: string
      target_sha:
        description: 'Full 40-character SHA of the exact current main commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Build and authorize the exact tag handoff
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.identity.outputs.target_sha }}
      artifact_file: ${{ steps.identity.outputs.artifact_file }}
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
      artifact_bytes: ${{ steps.identity.outputs.artifact_bytes }}
      artifact_entries: ${{ steps.identity.outputs.artifact_entries }}
      artifact_inventory_sha256: ${{ steps.identity.outputs.artifact_inventory_sha256 }}
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Fetch immutable release refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GIT_BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          printf '::add-mask::%s\n' "$GIT_BASIC_AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GIT_BASIC_AUTH" fetch origin main --tags

      - name: Check out the requested target commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Prepare private trusted Node runtime for Linux tests
        run: |
          set -euo pipefail
          source_node="$(command -v node)"
          private_node_dir="${RUNNER_TEMP}/linmas-trusted-node"
          private_node="${private_node_dir}/node"
          install -d -m 700 "${private_node_dir}"
          test ! -e "${private_node}"
          install -m 755 "${source_node}" "${private_node}"
          test -f "${private_node}"
          test ! -L "${private_node}"
          test "$(stat -c '%a' "${private_node}")" = "755"
          test "$(stat -c '%a' "${private_node_dir}")" = "700"
          active_version="$(node --version)"
          copied_version="$("${private_node}" --version)"
          [[ "${active_version}" =~ ^v24\. ]]
          test "${copied_version}" = "${active_version}"
          printf 'LINMAS_APPROVED_NODE_PATH=%s\n' "${private_node}" >> "${GITHUB_ENV}"
          printf '%s\n' "${private_node_dir}" >> "${GITHUB_PATH}"
      - name: Build pinned upstream bubblewrap sandbox
        run: |
          set -euo pipefail
          readonly bwrap_version='0.12.0'
          readonly bwrap_sha256='9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314'
          readonly bwrap_url="https://github.com/containers/bubblewrap/releases/download/v${bwrap_version}/bubblewrap-${bwrap_version}.tar.xz"
          readonly archive="${RUNNER_TEMP}/bubblewrap-${bwrap_version}.tar.xz"
          readonly source_dir="${RUNNER_TEMP}/bubblewrap-${bwrap_version}"
          readonly build_dir="${RUNNER_TEMP}/bubblewrap-${bwrap_version}-build"
          readonly private_root="${RUNNER_TEMP}/linmas-bubblewrap-${bwrap_version}"
          readonly private_bin="${private_root}/bin"
          readonly private_bwrap="${private_bin}/bwrap"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libcap-dev meson ninja-build pkg-config
          install -d -m 700 "${private_root}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${archive}" "${bwrap_url}"
          printf '%s  %s\n' "${bwrap_sha256}" "${archive}" | sha256sum --check --strict -
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
          meson setup "${build_dir}" "${source_dir}" \
            --prefix="${private_root}" \
            --bindir=bin \
            -Dbash_completion=disabled \
            -Dman=disabled \
            -Dselinux=disabled \
            -Dtests=false \
            -Dzsh_completion=disabled
          meson compile -C "${build_dir}"
          meson install -C "${build_dir}"
          chmod 700 "${private_bin}"
          test -f "${private_bwrap}"
          test ! -L "${private_bwrap}"
          test "$(stat -c '%u' "${private_root}")" = "$(id -u)"
          test "$(stat -c '%u' "${private_bin}")" = "$(id -u)"
          test "$(stat -c '%u' "${private_bwrap}")" = "$(id -u)"
          test "$(stat -c '%a' "${private_root}")" = '700'
          test "$(stat -c '%a' "${private_bin}")" = '700'
          chmod 755 "${private_bwrap}"
          test "$(stat -c '%a' "${private_bwrap}")" = '755'
          private_bwrap_mode="$(stat -c '%a' "${private_bwrap}")"
          test "$(( 8#${private_bwrap_mode} & 8#6000 ))" = '0'
          test "$("${private_bwrap}" --version)" = "bubblewrap ${bwrap_version}"
          "${private_bwrap}" --help 2>&1 | grep -F -- '--disable-userns'
          printf 'LINMAS_APPROVED_BWRAP_PATH=%s\n' "${private_bwrap}" >> "${GITHUB_ENV}"
          printf 'LINMAS_APPROVED_BWRAP_VERSION=%s\n' "${bwrap_version}" >> "${GITHUB_ENV}"
          printf '%s\n' "${private_bin}" >> "${GITHUB_PATH}"
      - name: Verify propagated pinned bubblewrap sandbox
        run: |
          set -euo pipefail
          test "$(command -v bwrap)" = "${LINMAS_APPROVED_BWRAP_PATH}"
          test -f "${LINMAS_APPROVED_BWRAP_PATH}"
          test ! -L "${LINMAS_APPROVED_BWRAP_PATH}"
          test "$(stat -c '%a' "$(dirname "${LINMAS_APPROVED_BWRAP_PATH}")")" = '700'
          test "$(stat -c '%a' "${LINMAS_APPROVED_BWRAP_PATH}")" = '755'
          propagated_bwrap_mode="$(stat -c '%a' "${LINMAS_APPROVED_BWRAP_PATH}")"
          test "$(( 8#${propagated_bwrap_mode} & 8#6000 ))" = '0'
          test "$(bwrap --version)" = "bubblewrap ${LINMAS_APPROVED_BWRAP_VERSION}"
          bwrap --help 2>&1 | grep -F -- '--disable-userns'
      - name: Verify required Linux bubblewrap namespaces
        run: |
          set -euo pipefail
          host_user_namespace="$(readlink /proc/self/ns/user)"
          host_pid_namespace="$(readlink /proc/self/ns/pid)"
          host_network_namespace="$(readlink /proc/self/ns/net)"
          host_mount_namespace="$(readlink /proc/self/ns/mnt)"
          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-all \
            --unshare-user \
            --disable-userns \
            --cap-drop ALL \
            --size 1048576 \
            --tmpfs / \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind-try /lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --dir /tmp \
            --setenv HOST_USER_NAMESPACE "${host_user_namespace}" \
            --setenv HOST_PID_NAMESPACE "${host_pid_namespace}" \
            --setenv HOST_NETWORK_NAMESPACE "${host_network_namespace}" \
            --setenv HOST_MOUNT_NAMESPACE "${host_mount_namespace}" \
            -- /bin/sh -ceu '
              test "$(readlink /proc/self/ns/user)" != "${HOST_USER_NAMESPACE}"
              test "$(readlink /proc/self/ns/pid)" != "${HOST_PID_NAMESPACE}"
              test "$(readlink /proc/self/ns/net)" != "${HOST_NETWORK_NAMESPACE}"
              test "$(readlink /proc/self/ns/mnt)" != "${HOST_MOUNT_NAMESPACE}"
              grep -q "lo:" /proc/net/dev
              test -w /tmp
              printf namespace-preflight-ok
            '

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run release checks without lifecycle scripts
        run: |
          npm test --ignore-scripts
          npm run validate --ignore-scripts
          npm run eval:offline --ignore-scripts
          npm pack --dry-run --ignore-scripts

      - name: Build and measure the exact package handoff
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HANDOFF_DIR="$RUNNER_TEMP/linmas-tag-authorization"
          rm -rf "$HANDOFF_DIR"
          mkdir -p "$HANDOFF_DIR/plugin"
          EXPECTED="linmas-${REQUESTED_VERSION}.tgz"
          npm pack --ignore-scripts --silent --pack-destination "$HANDOFF_DIR"
          test -f "$HANDOFF_DIR/$EXPECTED"
          node scripts/build-codex-plugin.mjs --target "$HANDOFF_DIR/plugin/linmas"
          node scripts/artifact-integrity.mjs \
            --root-dir "$GITHUB_WORKSPACE" \
            --artifact-root "$HANDOFF_DIR" \
            --package-path "$EXPECTED" \
            --plugin-path plugin/linmas \
            --expected-version "$REQUESTED_VERSION" \
            --output handoff.json
          PACKAGE_SHA256="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.sha256)")"
          PACKAGE_BYTES="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.bytes)")"
          PACKAGE_ENTRIES="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.entryCount)")"
          PACKAGE_INVENTORY_SHA256="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.inventorySha256)")"
          GIT_BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          printf '::add-mask::%s\n' "$GIT_BASIC_AUTH"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $GIT_BASIC_AUTH" \
          node scripts/validate-release-request.mjs \
            --phase prepare \
            --version "$REQUESTED_VERSION" \
            --target-sha "$TARGET_SHA" \
            --main-ref origin/main \
            --checkout-role target \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-filename "$EXPECTED" \
            --artifact-sha256 "$PACKAGE_SHA256" \
            --artifact-bytes "$PACKAGE_BYTES" \
            --artifact-entries "$PACKAGE_ENTRIES" \
            --artifact-inventory-sha256 "$PACKAGE_INVENTORY_SHA256"
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::authorization checks modified the target checkout"
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_file=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$PACKAGE_SHA256" >> "$GITHUB_OUTPUT"
          echo "artifact_bytes=$PACKAGE_BYTES" >> "$GITHUB_OUTPUT"
          echo "artifact_entries=$PACKAGE_ENTRIES" >> "$GITHUB_OUTPUT"
          echo "artifact_inventory_sha256=$PACKAGE_INVENTORY_SHA256" >> "$GITHUB_OUTPUT"

  tag:
    name: Create the authorized immutable tag
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      ARTIFACT_FILE: ${{ needs.authorize.outputs.artifact_file }}
      ARTIFACT_SHA256: ${{ needs.authorize.outputs.artifact_sha256 }}
      ARTIFACT_BYTES: ${{ needs.authorize.outputs.artifact_bytes }}
      ARTIFACT_ENTRIES: ${{ needs.authorize.outputs.artifact_entries }}
      ARTIFACT_INVENTORY_SHA256: ${{ needs.authorize.outputs.artifact_inventory_sha256 }}
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Recheck target, tag, and external release availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          GIT_BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          printf '::add-mask::%s\n' "$GIT_BASIC_AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GIT_BASIC_AUTH" fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]]
          [[ "$MAIN_SHA" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$MAIN_SHA" ]]
          [[ "$(git ls-files --error-unmatch scripts/registry-result.mjs)" == "scripts/registry-result.mjs" ]]
          TAG="v${REQUESTED_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::release tag already exists locally"
            exit 1
          fi
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GIT_BASIC_AUTH" ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" >/dev/null 2>&1; then
            echo "::error::release tag already exists remotely"
            exit 1
          fi
          NPM_RESULT="$(node "$GITHUB_WORKSPACE/scripts/registry-result.mjs" --version "$REQUESTED_VERSION")"
          if [[ "$NPM_RESULT" != "absent" ]]; then
            echo "::error::npm version already exists or registry response was indeterminate"
            exit 1
          fi
          set +e
          GH_DIAGNOSTIC="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"
          GH_STATUS=$?
          set -e
          if [[ "$GH_STATUS" -eq 0 || ! "$GH_DIAGNOSTIC" =~ [Rr]elease[[:space:]]not[[:space:]]found ]]; then
            echo "::error::GitHub release collision check failed"
            exit 1
          fi

      - name: Create and push the immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${REQUESTED_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "$TAG"
          GIT_BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          printf '::add-mask::%s\n' "$GIT_BASIC_AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $GIT_BASIC_AUTH" push origin "refs/tags/$TAG"

      - name: Dispatch the exact release handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="v${REQUESTED_VERSION}" \
            -f target_sha="$TARGET_SHA" \
            -f artifact_file="$ARTIFACT_FILE" \
            -f artifact_sha256="$ARTIFACT_SHA256" \
            -f artifact_bytes="$ARTIFACT_BYTES" \
            -f artifact_entries="$ARTIFACT_ENTRIES" \
            -f artifact_inventory_sha256="$ARTIFACT_INVENTORY_SHA256"
