name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release version, for example 0.9.0'
        required: true
        type: string
      target_sha:
        description: 'Full 40-character SHA of the exact current main commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Build and authorize the exact tag handoff
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.identity.outputs.target_sha }}
      artifact_file: ${{ steps.identity.outputs.artifact_file }}
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
      artifact_bytes: ${{ steps.identity.outputs.artifact_bytes }}
      artifact_entries: ${{ steps.identity.outputs.artifact_entries }}
      artifact_inventory_sha256: ${{ steps.identity.outputs.artifact_inventory_sha256 }}
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Fetch immutable release refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" fetch origin main --tags

      - name: Check out the requested target commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run release checks without lifecycle scripts
        run: |
          npm test --ignore-scripts
          npm run validate --ignore-scripts
          npm run eval:offline --ignore-scripts
          npm pack --dry-run --ignore-scripts

      - name: Build and measure the exact package handoff
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.extraheader
          GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ${{ github.token }}'
        run: |
          set -euo pipefail
          HANDOFF_DIR="$RUNNER_TEMP/linmas-tag-authorization"
          rm -rf "$HANDOFF_DIR"
          mkdir -p "$HANDOFF_DIR/plugin"
          EXPECTED="linmas-${REQUESTED_VERSION}.tgz"
          npm pack --ignore-scripts --silent --pack-destination "$HANDOFF_DIR"
          test -f "$HANDOFF_DIR/$EXPECTED"
          node scripts/build-codex-plugin.mjs --target "$HANDOFF_DIR/plugin/linmas"
          node scripts/artifact-integrity.mjs \
            --root-dir "$GITHUB_WORKSPACE" \
            --artifact-root "$HANDOFF_DIR" \
            --package-path "$EXPECTED" \
            --plugin-path plugin/linmas \
            --expected-version "$REQUESTED_VERSION" \
            --output handoff.json
          PACKAGE_SHA256="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.sha256)")"
          PACKAGE_BYTES="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.bytes)")"
          PACKAGE_ENTRIES="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.entryCount)")"
          PACKAGE_INVENTORY_SHA256="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$HANDOFF_DIR/handoff.json')).package.inventorySha256)")"
          node scripts/validate-release-request.mjs \
            --phase prepare \
            --version "$REQUESTED_VERSION" \
            --target-sha "$TARGET_SHA" \
            --main-ref origin/main \
            --checkout-role target \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-filename "$EXPECTED" \
            --artifact-sha256 "$PACKAGE_SHA256" \
            --artifact-bytes "$PACKAGE_BYTES" \
            --artifact-entries "$PACKAGE_ENTRIES" \
            --artifact-inventory-sha256 "$PACKAGE_INVENTORY_SHA256"
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::authorization checks modified the target checkout"
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_file=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$PACKAGE_SHA256" >> "$GITHUB_OUTPUT"
          echo "artifact_bytes=$PACKAGE_BYTES" >> "$GITHUB_OUTPUT"
          echo "artifact_entries=$PACKAGE_ENTRIES" >> "$GITHUB_OUTPUT"
          echo "artifact_inventory_sha256=$PACKAGE_INVENTORY_SHA256" >> "$GITHUB_OUTPUT"

  tag:
    name: Create the authorized immutable tag
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
      ARTIFACT_FILE: ${{ needs.authorize.outputs.artifact_file }}
      ARTIFACT_SHA256: ${{ needs.authorize.outputs.artifact_sha256 }}
      ARTIFACT_BYTES: ${{ needs.authorize.outputs.artifact_bytes }}
      ARTIFACT_ENTRIES: ${{ needs.authorize.outputs.artifact_entries }}
      ARTIFACT_INVENTORY_SHA256: ${{ needs.authorize.outputs.artifact_inventory_sha256 }}
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Recheck target, tag, and external release availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main^{commit})"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]]
          [[ "$MAIN_SHA" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$MAIN_SHA" ]]
          [[ "$(git ls-files --error-unmatch scripts/registry-result.mjs)" == "scripts/registry-result.mjs" ]]
          TAG="v${REQUESTED_VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::release tag already exists locally"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" >/dev/null 2>&1; then
            echo "::error::release tag already exists remotely"
            exit 1
          fi
          NPM_RESULT="$(node "$GITHUB_WORKSPACE/scripts/registry-result.mjs" --version "$REQUESTED_VERSION")"
          if [[ "$NPM_RESULT" != "absent" ]]; then
            echo "::error::npm version already exists or registry response was indeterminate"
            exit 1
          fi
          set +e
          GH_DIAGNOSTIC="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"
          GH_STATUS=$?
          set -e
          if [[ "$GH_STATUS" -eq 0 || ! "$GH_DIAGNOSTIC" =~ [Rr]elease[[:space:]]not[[:space:]]found ]]; then
            echo "::error::GitHub release collision check failed"
            exit 1
          fi

      - name: Create and push the immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${REQUESTED_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "$TAG"
          git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" push origin "refs/tags/$TAG"

      - name: Dispatch the exact release handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="v${REQUESTED_VERSION}" \
            -f target_sha="$TARGET_SHA" \
            -f artifact_file="$ARTIFACT_FILE" \
            -f artifact_sha256="$ARTIFACT_SHA256" \
            -f artifact_bytes="$ARTIFACT_BYTES" \
            -f artifact_entries="$ARTIFACT_ENTRIES" \
            -f artifact_inventory_sha256="$ARTIFACT_INVENTORY_SHA256"
